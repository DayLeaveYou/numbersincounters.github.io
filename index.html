<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numbers in Counters</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1628;
            color: white;
        }

        header {
            text-align: center;
            padding: 30px 20px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
        }

        .subtitle {
            margin-top: 10px;
            color: #b8c7dc;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        .counter-card {
            background: #142238;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .counter-title {
            font-size: 20px;
            margin-bottom: 15px;
        }

        .counter-source {
            color: #4ade80;
            font-size: 14px;
            margin-bottom: 15px;
        }

        iframe {
            display: block;
            margin: auto;
            max-width: 100%;
        }

        footer {
            text-align: center;
            color: #718096;
            font-size: 13px;
            padding: 30px;
        }
    </style>
</head>

<body>

<header>
    <h1>🌍 Numbers in Counters</h1>
    <div class="subtitle">
        Real-time counters and statistics from around the world
    </div>
</header>

<div class="container">

    <div class="counter-card">
        <div class="counter-title">🌍 World Population</div>

        <div class="counter-source">
            Source: TheWorldCounts.com
        </div>

        <iframe
            title="World Population"
            src="https://www.theworldcounts.com/embeds/counters/121?background_color=white&color=black&font_family=%22Helvetica+Neue%22%2C+Arial%2C+sans-serif&font_size=14"
            style="border: none"
            height="100"
            width="300">
        </iframe>
    </div>

</div>

<footer>
    Numbers in Counters
</footer>

</body>
</html>
