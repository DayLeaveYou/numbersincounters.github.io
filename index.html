<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>World Counters</title>


    <style>

        /* =========================
           PAGRINDINIAI NUSTATYMAI
        ========================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #fdf2f8,
                    #ecfeff
                );

            color: #1e293b;

            min-height: 100vh;
        }


        /* =========================
           VIRŠUTINĖ ANTRAŠTĖ
        ========================= */

        header {

            text-align: center;

            padding:
                45px
                20px
                35px;

        }


        header h1 {

            margin: 0;

            font-size: 42px;

            font-weight: 800;

            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #9333ea,
                    #ec4899
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

        }


        .subtitle {

            margin-top: 12px;

            font-size: 17px;

            color: #64748b;

        }


        /* =========================
           PAGRINDINIS KONTEINERIS
        ========================= */

        .container {

            max-width: 1100px;

            margin: auto;

            padding:
                10px
                25px
                50px;

        }


        /* =========================
           COUNTERIŲ TINKLELIS
        ========================= */

        .counter-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 25px;

        }


        /* =========================
           COUNTERIO KORTELĖ
        ========================= */

        .counter-card {

            background: white;

            border-radius: 20px;

            padding: 25px;

            min-height: 230px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            box-shadow:
                0 10px 30px
                rgba(
                    15,
                    23,
                    42,
                    0.10
                );

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;

            border-top:
                6px solid
                #6366f1;

        }


        /* Kortelės efektas užvedus pelę */

        .counter-card:hover {

            transform:
                translateY(-6px);

            box-shadow:
                0 18px 40px
                rgba(
                    15,
                    23,
                    42,
                    0.16
                );

        }


        /* =========================
           COUNTERIO PAVADINIMAS
        ========================= */

        .counter-title {

            font-size: 22px;

            font-weight: 700;

            margin-bottom: 8px;

        }


        /* =========================
           ŠALTINIS
        ========================= */

        .counter-source {

            font-size: 14px;

            color: #64748b;

            margin-bottom: 18px;

        }


        .counter-source span {

            color: #2563eb;

            font-weight: 600;

        }


        /* =========================
           IFRAME
        ========================= */

        iframe {

            display: block;

            border: none;

            max-width: 100%;

        }


        /* =========================
           PIRMOS KORTELĖS SPALVA
        ========================= */

        .population-card {

            border-top-color:
                #2563eb;

        }


        /* =========================
           AFRIKOS KORTELĖS SPALVA
        ========================= */

        .africa-card {

            border-top-color:
                #f97316;

        }


        /* =========================
           APAČIA
        ========================= */

        footer {

            text-align: center;

            padding:
                25px;

            color:
                #94a3b8;

            font-size:
                14px;

        }


        /* =========================
           TELEFONAI
        ========================= */

        @media (
            max-width: 700px
        ) {

            header h1 {

                font-size:
                    32px;

            }


            .counter-grid {

                grid-template-columns:
                    1fr;

            }


            .container {

                padding:
                    10px
                    15px
                    40px;

            }

        }


    </style>

</head>


<body>


    <!-- =========================
         ANTRAŠTĖ
    ========================= -->

    <header>

        <h1>
            🌍 Numbers in Counters
        </h1>

        <div class="subtitle">

            Real-time counters and statistics
            from around the world

        </div>

    </header>



    <!-- =========================
         PAGRINDINIS TURINYS
    ========================= -->

    <div class="container">


        <!-- =========================
             COUNTERIŲ TINKLELIS
        ========================= -->

        <div class="counter-grid">


            <!-- =========================
                 1. WORLD POPULATION
            ========================= -->

            <div class="
                counter-card
                population-card
            ">

                <div class="counter-title">

                    🌍 World Population

                </div>


                <div class="counter-source">

                    Source:
                    <span>
                        TheWorldCounts.com
                    </span>

                </div>


                <iframe
                    title="World Population"
                    src="https://www.theworldcounts.com/embeds/counters/121?background_color=white&color=black&font_family=%22Helvetica+Neue%22%2C+Arial%2C+sans-serif&font_size=14"
                    height="100"
                    width="300">
                </iframe>


            </div>



            <!-- =========================
                 2. POPULATION OF AFRICA
            ========================= -->

            <div class="
                counter-card
                africa-card
            ">

                <div class="counter-title">

                    🌍 Population of Africa

                </div>


                <div class="counter-source">

                    Source:
                    <span>
                        TheWorldCounts.com
                    </span>

                </div>


                <iframe
                    title="Population of Africa"
                    src="https://www.theworldcounts.com/embeds/counters/130?background_color=white&color=black&font_family=%22Helvetica+Neue%22%2C+Arial%2C+sans-serif&font_size=14"
                    height="100"
                    width="300">
                </iframe>


            </div>


        </div>


    </div>



    <!-- =========================
         PUSLAPIO APAČIA
    ========================= -->

    <footer>

        Numbers in Counters

    </footer>


</body>

</html>
